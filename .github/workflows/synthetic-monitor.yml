name: Synthetic monitoring

on:
  workflow_dispatch:
    inputs:
      baseUrl:
        description: "Base URL del entorno (e.g., https://staging.tu-dominio.com)"
        required: true
        type: string
  schedule:
    - cron: '*/15 * * * *' # cada 15 minutos

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ github.event.inputs.baseUrl }}
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - name: Check health endpoint
        shell: bash
        run: |
          set -e
          URL="${BASE_URL:-$STAGING_BASE_URL}"
          echo "Pinging $URL/api/status"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/status")
          echo "Status: $code"
          if [ "$code" != "200" ]; then
            echo "Health check failed" >&2
            exit 1
          fi
