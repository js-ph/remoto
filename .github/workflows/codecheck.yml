name: Chequeo de código

on: 
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
    - main

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: admin
          MARIADB_DATABASE: sise_lite_hybrid
        ports:
          - 4000:4000
        

    steps:
      name: Checkout
      uses: actions/checkout@v5

      name: Configurar Node versión 18
      uses: actions/setup-node@v6
      with:
        node-version: 18

      name: Instalación de dependencias
      run: npm ci

      name: Revisar código con linter
      run: npm run lint

      name: Correr tests
      run: npm test

      name: Compilar app en next.js
      run: npm run build

      name: Levantar contenedor de docker compose
      run: docker compose up -d --build
      
